name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Parse Windows PowerShell installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @('scripts/install_windows.ps1', 'scripts/build_source_zip.ps1', 'scripts/build_windows.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$script contains a PowerShell parse error: $($errors[0])" }
          }

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/build_source_zip.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sNote-windows-x64
          path: |
            release/sNote-*-windows-x64.zip
            release/sNote-*-source-auto-install.zip
