name: Publish sNote release

on:
  push:
    branches: [main]
    paths:
      - "src/snote/__init__.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.repository == 'jtl-sun/sNote'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content src/snote/__init__.py -Raw
          if ($source -notmatch '__version__\s*=\s*"(\d+\.\d+\.\d+)"') { throw "Invalid sNote release version." }
          $number = $Matches[1]
          "number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Build standalone Windows EXE ZIP
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Build auto-install source ZIP
        shell: pwsh
        run: ./scripts/build_source_zip.ps1
      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.number }}'
          $files = @(Get-ChildItem release -Filter "sNote-$version-*.zip" | Sort-Object Name)
          if ($files.Count -ne 2) { throw "Expected two release ZIPs for version $version." }
          $checksums = @($files | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" })
          $checksums | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
      - name: Publish tagged GitHub Release with both ZIPs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: sNote ${{ steps.version.outputs.number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/sNote-${{ steps.version.outputs.number }}-windows-x64.zip
            release/sNote-${{ steps.version.outputs.number }}-source-auto-install.zip
            release/SHA256SUMS.txt