name: Build mEdit for Windows

on:
  push:
    branches:
      - agent/build-marktext-classic-menu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@10.33.4

      - name: Download pinned MarkText source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/marktext/marktext.git marktext
          Set-Location marktext
          git fetch --depth 1 origin e52106f
          git checkout e52106f

      - name: Apply classic drop-down menu patch
        shell: pwsh
        run: |
          $patchBase64 = ''
          [IO.File]::WriteAllBytes('marktext/classic-menu.patch', [Convert]::FromBase64String($patchBase64))
          Set-Location marktext
          git apply --check classic-menu.patch
          git apply classic-menu.patch
          git diff --check

      - name: Install dependencies
        working-directory: marktext
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Brand the isolated test build as mEdit
        shell: pwsh
        run: |
          $builderPath = 'marktext/packages/desktop/electron-builder.yml'
          $builder = Get-Content $builderPath -Raw
          $builder = $builder.Replace('appId: com.github.marktext.marktext', 'appId: com.jtlsun.medit')
          $builder = $builder.Replace('productName: marktext', 'productName: mEdit')
          $builder = $builder.Replace('executableName: marktext', 'executableName: mEdit')
          $builder = $builder.Replace('marktext-win-', 'mEdit-Windows-')
          $builder = [regex]::Replace($builder, '(?ms)^fileAssociations:.*?^win:', 'win:')
          Set-Content $builderPath $builder -NoNewline

          $packagePath = 'marktext/packages/desktop/package.json'
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $package | Add-Member -NotePropertyName productName -NotePropertyValue 'mEdit' -Force
          $package.description = 'mEdit Markdown editor'
          $package | ConvertTo-Json -Depth 100 | Set-Content $packagePath

          $replacements = @(
            @{ Path = 'marktext/packages/desktop/src/renderer/src/components/titleBar/index.vue'; Old = '>MarkText<'; New = '>mEdit<' },
            @{ Path = 'marktext/packages/desktop/src/renderer/src/components/about/index.vue'; Old = "const name = 'MarkText'"; New = "const name = 'mEdit'" },
            @{ Path = 'marktext/packages/desktop/src/renderer/index.html'; Old = '<title>MarkText</title>'; New = '<title>mEdit</title>' },
            @{ Path = 'marktext/packages/desktop/src/main/index.ts'; Old = "productName: 'marktext'"; New = "productName: 'mEdit'" },
            @{ Path = 'marktext/packages/desktop/src/main/exceptionHandler.ts'; Old = 'MarkText:'; New = 'mEdit:' },
            @{ Path = 'marktext/packages/desktop/src/main/exceptionHandler.ts'; Old = "companyName: 'marktext'"; New = "companyName: 'mEdit'" },
            @{ Path = 'marktext/packages/desktop/src/main/exceptionHandler.ts'; Old = "productName: 'marktext'"; New = "productName: 'mEdit'" },
            @{ Path = 'marktext/packages/desktop/src/main/windows/editor.ts'; Old = 'MarkText has crashed'; New = 'mEdit has crashed' },
            @{ Path = 'marktext/packages/desktop/src/main/cli/index.ts'; Old = 'MarkText:'; New = 'mEdit:' }
          )
          foreach ($replacement in $replacements) {
            $content = Get-Content $replacement.Path -Raw
            $content = $content.Replace($replacement.Old, $replacement.New)
            Set-Content $replacement.Path $content -NoNewline
          }

          Copy-Item 'build-assets/medit-icon.ico' 'marktext/packages/desktop/static/icon.ico' -Force
          Copy-Item 'build-assets/medit-icon.ico' 'marktext/packages/desktop/build/icons/icon.ico' -Force
          Copy-Item 'build-assets/medit-icon.png' 'marktext/packages/desktop/static/icon.png' -Force
          Copy-Item 'build-assets/medit-icon.png' 'marktext/packages/desktop/build/icons/icon.png' -Force
          magick 'build-assets/medit-icon.png' -resize 96x96 'marktext/packages/desktop/static/logo-96px.png'
          magick 'build-assets/medit-icon.png' -resize 1025x1025 'marktext/packages/desktop/static/logo-small.png'
          magick 'build-assets/medit-icon.png' -resize 150x150 'marktext/packages/desktop/src/renderer/src/assets/images/logo.png'

      - name: Prepare Electron native dependencies
        working-directory: marktext
        shell: pwsh
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm

      - name: Verify TypeScript
        working-directory: marktext
        shell: pwsh
        run: pnpm --filter marktext typecheck

      - name: Build installer and portable ZIP
        working-directory: marktext
        shell: pwsh
        run: pnpm build:win:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash marktext/dist/*.exe, marktext/dist/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content marktext/dist/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mEdit-Windows-x64
          retention-days: 30
          if-no-files-found: error
          path: |
            marktext/dist/*.exe
            marktext/dist/*.zip
            marktext/dist/SHA256SUMS.txt
