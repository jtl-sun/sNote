name: Build MarkText Classic Menu for Windows

on:
  push:
    branches:
      - agent/build-marktext-classic-menu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@10.33.4

      - name: Download pinned MarkText source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/marktext/marktext.git marktext
          Set-Location marktext
          git fetch --depth 1 origin e52106f
          git checkout e52106f

      - name: Apply classic drop-down menu patch
        shell: pwsh
        run: |
          $patchBase64 = ''
          [IO.File]::WriteAllBytes('marktext/classic-menu.patch', [Convert]::FromBase64String($patchBase64))
          Set-Location marktext
          git apply --check classic-menu.patch
          git apply classic-menu.patch
          git diff --check

      - name: Install dependencies
        working-directory: marktext
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Isolate the test build from regular MarkText
        shell: pwsh
        run: |
          $builderPath = 'marktext/packages/desktop/electron-builder.yml'
          $builder = Get-Content $builderPath -Raw
          $builder = $builder.Replace('appId: com.github.marktext.marktext', 'appId: com.jtlsun.marktext.classicmenu')
          $builder = $builder.Replace('productName: marktext', 'productName: MarkText Classic Menu')
          $builder = $builder.Replace('executableName: marktext', 'executableName: marktext-classic-menu')
          $builder = $builder.Replace('marktext-win-', 'MarkText-Classic-Menu-Windows-')
          $builder = [regex]::Replace($builder, '(?ms)^fileAssociations:.*?^win:', 'win:')
          Set-Content $builderPath $builder -NoNewline

          $packagePath = 'marktext/packages/desktop/package.json'
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $package | Add-Member -NotePropertyName productName -NotePropertyValue 'MarkText Classic Menu' -Force
          $package | ConvertTo-Json -Depth 100 | Set-Content $packagePath

      - name: Prepare Electron native dependencies
        working-directory: marktext
        shell: pwsh
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm

      - name: Verify TypeScript
        working-directory: marktext
        shell: pwsh
        run: pnpm --filter marktext typecheck

      - name: Build installer and portable ZIP
        working-directory: marktext
        shell: pwsh
        run: pnpm build:win:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash marktext/dist/*.exe, marktext/dist/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content marktext/dist/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MarkText-Classic-Menu-Windows-x64
          retention-days: 30
          if-no-files-found: error
          path: |
            marktext/dist/*.exe
            marktext/dist/*.zip
            marktext/dist/SHA256SUMS.txt
