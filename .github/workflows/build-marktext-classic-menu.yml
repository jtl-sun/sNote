name: Build mEdit 0.21.0 for Windows

on:
  push:
    branches:
      - agent/build-marktext-classic-menu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out mEdit build branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@10.33.4

      - name: Download pinned editor source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/marktext/marktext.git marktext
          Set-Location marktext
          git fetch --depth 1 origin e52106f
          git checkout e52106f

      - name: Apply complete mEdit 0.21.0 source patch
        shell: pwsh
        run: |
          Set-Location marktext
          git apply --check ../build-assets/mEdit-0.21.0-source.patch
          git apply ../build-assets/mEdit-0.21.0-source.patch
          git diff --check

      - name: Install dependencies
        working-directory: marktext
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install mEdit application icon
        shell: pwsh
        run: |
          Copy-Item 'build-assets/medit-icon.ico' 'marktext/packages/desktop/static/icon.ico' -Force
          Copy-Item 'build-assets/medit-icon.ico' 'marktext/packages/desktop/build/icons/icon.ico' -Force
          Copy-Item 'build-assets/medit-icon.png' 'marktext/packages/desktop/static/icon.png' -Force
          Copy-Item 'build-assets/medit-icon.png' 'marktext/packages/desktop/build/icons/icon.png' -Force
          magick 'build-assets/medit-icon.png' -resize 96x96 'marktext/packages/desktop/static/logo-96px.png'
          magick 'build-assets/medit-icon.png' -resize 1025x1025 'marktext/packages/desktop/static/logo-small.png'
          magick 'build-assets/medit-icon.png' -resize 150x150 'marktext/packages/desktop/src/renderer/src/assets/images/logo.png'

      - name: Prepare Electron native dependencies
        working-directory: marktext
        shell: pwsh
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm

      - name: Verify mEdit source
        shell: pwsh
        run: |
          $package = Get-Content 'marktext/packages/desktop/package.json' -Raw | ConvertFrom-Json
          if ($package.version -ne '0.21.0') {
            throw "Expected mEdit 0.21.0, found $($package.version)"
          }

          $editorCss = Get-Content 'marktext/packages/muya/src/assets/styles/blockSyntax.css' -Raw
          if ($editorCss -notmatch '(?s)\.mu-container\s*\{.*?margin:\s*0;') {
            throw 'The editor container is not left aligned.'
          }
          if ($editorCss -match '(?s)\.mu-container\s*\{.*?margin:\s*0\s+auto;') {
            throw 'A centered editor rule is still present.'
          }

          $forbidden = Get-ChildItem 'marktext/packages/desktop/src','marktext/packages/desktop/static' -Recurse -File |
            Select-String -Pattern 'marktext\.me|github\.com/marktext|twitter\.com/marktext|marktext\.app'
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_ }
            throw 'MarkText information links remain in the mEdit application source.'
          }

      - name: Verify TypeScript
        working-directory: marktext
        shell: pwsh
        run: pnpm --filter marktext typecheck

      - name: Build mEdit 0.21.0 installer and portable ZIP
        working-directory: marktext
        shell: pwsh
        run: pnpm build:win:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged renderer
        shell: pwsh
        run: |
          $compiledCss = (Get-Content 'marktext/packages/desktop/out/renderer/assets/*.css' -Raw) -join [Environment]::NewLine
          if ($compiledCss -notmatch '(?s)\.mu-container\s*\{.*?margin:\s*0;') {
            throw 'The packaged editor is not left aligned.'
          }

          $forbidden = Get-ChildItem 'marktext/packages/desktop/out' -Recurse -Include '*.js','*.css','*.html' |
            Select-String -Pattern 'marktext\.me|github\.com/marktext|twitter\.com/marktext|marktext\.app'
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_ }
            throw 'MarkText information links remain in the packaged application.'
          }

          if (-not (Test-Path 'marktext/dist/mEdit-Windows-x64-0.21.0-setup.exe')) {
            throw 'The versioned mEdit 0.21.0 installer was not created.'
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash marktext/dist/*.exe, marktext/dist/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content marktext/dist/SHA256SUMS.txt

      - name: Upload mEdit 0.21.0 Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mEdit-0.21.0-Windows-x64
          retention-days: 30
          if-no-files-found: error
          path: |
            marktext/dist/*.exe
            marktext/dist/*.zip
            marktext/dist/SHA256SUMS.txt
